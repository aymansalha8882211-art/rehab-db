name: CI

# Runs on every push and pull request. Before this the repository had no
# automated checks at all: typecheck was broken and never invoked, and there
# were no tests, so a change that did not compile could reach production and
# only fail once someone opened the page.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Enforced. The tree is clean, so anything that lands here has to stay
      # that way rather than adding to a backlog nobody reads.
      - name: Typecheck
        run: npm run typecheck
